name: Deploy to Hostinger

# Builda o portfólio e publica o conteúdo de dist/ no Hostinger (via SSH/rsync)
# a cada push na branch main. Também pode ser disparado manualmente.
#
# SEGURANÇA: deploy REAL só em push na main (ou dispatch com dry_run=false).
# Em qualquer outra branch o rsync roda com --dry-run (não altera produção).
on:
  push:
    branches:
      - main
      - feat/seo-improvements   # TEMPORÁRIO: valida o workflow em dry-run antes do merge
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular o deploy (rsync --dry-run), sem alterar produção'
        type: boolean
        default: true

# Um deploy por vez POR REF. Grupo por ref impede que um dry-run de outra branch
# cancele um deploy real em andamento na main; cancel-in-progress=false faz novos
# runs aguardarem na fila em vez de interromper um rsync de produção pela metade.
concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy to Hostinger via SSH (rsync)
        env:
          # Senha lida pelo sshpass via variável SSHPASS (evita expor no process list).
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          # Host key do servidor, fixada (pinning) para impedir MITM/captura de senha.
          # Gere uma vez em rede confiável: ssh-keyscan -p <porta> <ip>
          # e salve a saída completa no secret SSH_KNOWN_HOSTS.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          # Pasta-raiz do site no Hostinger (relativa ao home do SSH). Para o domínio
          # principal costuma ser public_html/. Ajuste via secret SSH_REMOTE_DIR se for
          # domínio adicionado (ex.: domains/pedrohenriquens.com.br/public_html/).
          REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR || 'public_html/' }}
          # Contexto para decidir dry-run x deploy real (lido via env, sem interpolar em run:).
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # Diagnóstico seguro: imprime só o TAMANHO de cada secret (0 = não chegou ao job).
          # Não revela valores (e o GitHub mascara o conteúdo de secrets nos logs).
          echo "Secrets no job (len, 0=ausente): IP=${#SSH_IP} PORT=${#SSH_PORT} USER=${#SSH_USERNAME} PASS=${#SSHPASS} KNOWN_HOSTS=${#SSH_KNOWN_HOSTS}"
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS chegou vazio. Verifique: (1) está em Settings > Secrets and variables > Actions, aba *Secrets* (não *Variables* nem *Environments*); (2) é Repository secret; (3) nome exato 'SSH_KNOWN_HOSTS'; (4) re-execute o workflow APÓS salvar."
            exit 1
          fi

          # Default seguro = dry-run. Deploy REAL apenas em push na main, ou em
          # workflow_dispatch com dry_run=false explícito.
          DRY=true
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            DRY=false
          fi
          # Deploy real via dispatch SÓ é permitido na main (evita publicar build de
          # outra branch); fora da main, um dry_run=false é rebaixado para dry-run com aviso.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            DRY=false
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
            echo "::warning::dry_run=false só faz deploy real na main. Em '$GIT_REF' o run continua como dry-run."
          fi

          RSYNC_EXTRA=""
          if [ "$DRY" = "true" ]; then
            RSYNC_EXTRA="--dry-run"
            echo "::notice::DRY-RUN ativo — valida conexão/host key/auth e LISTA mudanças, SEM alterar a produção."
          else
            echo "::notice::Deploy REAL para $REMOTE_DIR."
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Fixa a host key conhecida e exige verificação estrita (sem TOFU).
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Espelha dist/ na raiz do site. --delete remove assets antigos (hash do Vite);
          # .well-known é preservado para não quebrar a renovação de SSL.
          sshpass -e rsync -rlvz --delete $RSYNC_EXTRA \
            --exclude '.well-known' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "$SSH_USERNAME@$SSH_IP:$REMOTE_DIR"
