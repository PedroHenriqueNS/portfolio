# Complemento do httpd.conf padrão da imagem httpd:2.4, incluído por scripts/check-apache.sh.
# Reproduz o que a hospedagem compartilhada dá ao .htaccess: mod_rewrite, mod_headers e AllowOverride.
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

<Directory "/usr/local/apache2/htdocs">
  AllowOverride All
</Directory>
